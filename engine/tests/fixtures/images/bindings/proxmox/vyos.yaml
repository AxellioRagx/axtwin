binding_schema_version: 1
binding:
  image: vyos
  platform: proxmox
  versions:
    - id: "1.5"
      storage: { type: template, node: any, volid: "axrpool:base-9351-disk-0", template_vmid: 9351 }
      clone_mode: linked
      cloud_init: { supported: false, user: vyos, sysprep_required: false }  # generic ISO has no cloud-init; config via vyos-ssh-set (configure-router)
      hardware:
        machine: q35
        bios: seabios
        nic_model: virtio
        disk_bus: scsi
        scsi_controller: virtio-scsi-single
        agent: false
      placement_constraints:
        requires_host_caps: []
      clone_estimate: 30
