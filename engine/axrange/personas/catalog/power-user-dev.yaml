# docs/DESIGN_BRIEF_twin_model.md §5.2 — noisier egress, package pulls.
persona:
  id: power-user-dev
  os_family: linux
  drive: scripted
  emits:
    - proto: dns
      ports: [53]
      peer_role: dns-resolver
      # Same reasoning as corp-workstation: DNS is commonly hosted on the
      # DC, not a dedicated resolver role -- optional, resolve-if-present.
      optional: true
      direction: EW
      cadence: 24x7
      volume: low
    - proto: git
      ports: [443, 22]
      peer_role: egress
      direction: NS
      cadence: diurnal
      volume: med
    - proto: ssh
      ports: [22]
      peer_role: egress
      direction: NS
      cadence: diurnal
      volume: low
    - proto: https
      ports: [443]
      peer_role: egress-proxy
      direction: NS
      cadence: diurnal
      volume: high
    - proto: kerberos
      ports: [88]
      peer_role: domain-controller
      direction: EW
      cadence: diurnal
      volume: low
    - proto: smb
      ports: [445]
      peer_role: file-server
      direction: EW
      cadence: diurnal
      volume: low
  requires: [domain-controller, egress-proxy, file-server]
  knobs: { intensity: 1.4, schedule: business-hours, seed_jitter: true }
