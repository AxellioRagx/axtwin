# docs/DESIGN_BRIEF_twin_model.md §5.2 — bulk, bursty.
persona:
  id: file-server
  os_family: linux
  drive: real-service
  emits:
    - proto: smb
      ports: [445]
      peer_role: corp-workstation
      direction: EW
      cadence: diurnal
      volume: high
    - proto: nfs
      ports: [2049]
      peer_role: corp-workstation
      direction: EW
      cadence: diurnal
      volume: med
  requires: [corp-workstation]
  # GAP-032: assert against Samba's smbd -- the daemon backing this
  # persona's SMB (and NFS-adjacent) bulk-transfer signature.
  knobs: { intensity: 1.0, schedule: business-hours, seed_jitter: true, service_name: smbd }
