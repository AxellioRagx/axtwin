# sme-flat -- the root manifest (docs/WORK_ORDER_twin_consolidation.md §2;
# loader: axrange/twinconfig/manifest.py). Wiring only: which file is each
# tier's default and which are its variants. Every tier file stays
# deployable on its own by path; the manifest adds
# `--config sme-flat` and `--twin sme-flat [--variant <stem>]`.
#
# `containment:` is a CLAIM the loader checks against te.yaml's
# `twin_config.egress:` block (D3) -- not a second copy of the posture.
twin:
  id: sme-flat
  description: >
    Small/flat baseline twin: one subnet, a handful of servers, minimal
    segmentation.
  containment: uncontained
  tiers:
    te:
      default: te.yaml
    tfc:
      default: tfc/default.yaml
