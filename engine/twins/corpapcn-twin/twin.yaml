# corpapcn-twin -- the root manifest (docs/WORK_ORDER_twin_consolidation.md §2;
# loader: axrange/twinconfig/manifest.py). Wiring only: which file is each
# tier's default and which are its variants. Every tier file stays
# deployable on its own by path; the manifest adds
# `--config corpapcn-twin` and `--twin corpapcn-twin [--variant <stem>]`.
#
# `containment:` is a CLAIM the loader checks against te.yaml's
# `twin_config.egress:` block (D3) -- not a second copy of the posture.
# An aximprint cast: generated/ holds the id-stemmed topology export and
# scorecard the imprint/fidelity readers use (axrange/twinconfig/bundle.py).
twin:
  id: corpapcn-twin
  description: >
    Cast of CORP APCN (pit-63994c9543-1787823960, 2026-08-27), with its first
    fidelity scorecard.
  containment: uncontained
  tiers:
    te:
      default: te.yaml
    tap:
      default: tap/cast.yaml
      variants: [tap/all.yaml]
    tfc:
      default: tfc/cast.yaml
