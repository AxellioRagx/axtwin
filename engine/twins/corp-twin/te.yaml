  # The cast's inter-segment conduits, re-expressed on this twin's segments.
  # Conduits whose two ends now share one VLAN were dropped -- that traffic is
  # L2-local here, as it is on the real /20-/21 VLANs (17 of 40). Documentation
  # plus a cross-check: expand.py errors if no router joins both ends -- so a
  # VLAN end names its ROUTED side, the `mx-vlanN` anchor hq-mx has a leg on
  # (the hosts' `vlanN` access segment is behind the bridges), and VLAN953's
  # end is `mx-vlan935`, the hop hq-mx routes the /25 through (to the 9K VIP).
  conduits:
    - { from: lab-10-0-21, to: lab-10-20-200 }
    - { from: lab-10-112-140, to: mx-vlan20 }
    - { from: lab-10-128-215, to: lab-10-20-200 }
    - { from: lab-10-20-193, to: lab-10-20-196 }
    - { from: lab-10-20-193, to: lab-10-20-207 }
    - { from: lab-10-20-193, to: mx-vlan20 }
    - { from: lab-10-20-193, to: mx-vlan935 }
    - { from: lab-10-20-193, to: mx-vlan192 }
    - { from: lab-10-20-196, to: lab-10-20-200 }
    - { from: lab-10-20-196, to: lab-10-20-203 }
    - { from: lab-10-20-196, to: lab-10-20-204 }
    - { from: lab-10-20-196, to: lab-10-20-207 }
    - { from: lab-10-20-196, to: lab-10-21-161 }
    - { from: lab-10-20-196, to: lab-172-16 }
    - { from: lab-10-20-203, to: mx-vlan935 }
    - { from: lab-10-20-204, to: mx-vlan20 }
    - { from: lab-10-55-10, to: mx-vlan20 }
    - { from: lab-10-64-7, to: mx-vlan64 }
    - { from: mx-vlan20, to: mx-vlan48 }
    - { from: mx-vlan20, to: mx-vlan64 }
    - { from: mx-vlan192, to: mx-vlan20 }
    - { from: mx-vlan48, to: mx-vlan52 }
    - { from: mx-vlan192, to: mx-vlan64 }

