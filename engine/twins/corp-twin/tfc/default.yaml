# corp-twin -- the DEFAULT traffic profile: the discovery cast's own baseline
# (twin-configs-cast/corpapcn-disco/tfc.yaml), retargeted onto this twin.
#
# What changed from the cast's file, and nothing else:
#   * `target:` -> corp-twin (the twin NAME, resolved to its newest live te
#     deploy -- the cast's file pinned a destroyed deploy's id, LES-072).
#   * node ids resolved against THIS twin's default-gate expansion: an entry
#     naming a `count > 1` group stem is fanned out to its clones (`...core`
#     -> `...core01..NN`, same persona), and 45 entries naming hosts
#     the default gate removes (transient/regular, occupancy < 0.8) are
#     dropped -- a `node:` that is not a host is a hard error at apply
#     (o2control/traffic.py). Re-derive this file if you deploy at a different
#     DEPLOY_MIN_OCCUPANCY.
#   * the personas it names are this twin's copies in `personas/`, where every
#     `peer_role: internet-sink-N` became `peer_role: sink` (one sink here;
#     work order §7, gap G7). Loaded automatically when this file is applied
#     from inside the twin folder or via `--twin corp-twin`.
#
# Judge the resulting mix against the cast's measured one (work order §7):
# DNS the flow majority, external TLS the byte majority (6.3 of ~9 GB), SMB
# ~2.2 GB internal, Kerberos/LDAP/RPC/RDP small but present.
#
# Live run 3 (2026-09-28, work order §11) measured the cast personas far off
# that mix (bulk NTP/NetBIOS from the file server, no SMB, TLS:HTTP ~1:1);
# they were rebalanced in `personas/`, and ONE assignment beyond the cast's
# was added: `corp-file-share-client` on generic-endpoint-heavy-10-80-20-core01,
# the SMB client §7 measured (121 -> 122). tests/test_corp_twin_mix.py pins
# the modelled mix for this file and tfc/gate90.yaml.
#
# **Contain first.** Apply only after `hq-mx` is in `measure` and `te info`
# says `measure -- CONTAINED` (runbook §11 step 2).
