# corp-twin -- variant: the CAPTURE-RATE CEILING profile (2026-10-01, docs/reference/capture-rate/
# 2026-10-01-corp-twin-ladder.md): tfc/gate90.yaml's 84 assignments (same nodes, roles, seeds,
# schedules) with the offered load raised to the highest rung that kept BOTH zero drops on the
# whole mirror/capture chain AND the traffic's protocol health within the baseline's noise.
#
# How it scales (generator `gen_variant.py 6 --mode burst --min-interval 1 --keep ...`, recorded in the log):
#   * every emit of the scaled personas fires up to 6x as often (cyclic:N -> burst:max(1, N/6)s;
#     the 5 s emits clamp at 1 s = x5), with
#     its messages back-to-back instead of 0.05-0.5 s apart; message SIZE and COUNT are unchanged
#     (bigger messages do not help: caddy/smbd reset the personas' filler streams after the first
#     window, so only more connections raise the load);
#   * the three Windows corp-workstation personas stay UNSCALED (their gate90 ids): scaled, they
#     made the Windows DC retransmit/dup-ACK on 88/389/3268 (rung R4);
#   * x8, x12, x16 were capture-clean (zero drops) but made the single external sink (2 vCPU,
#     caddy) retransmit -- the twin's own limit for this mix; x8 failed 1 of 3 samples over 35 min.
# Measured (final soak F2, 33 min): 29,945 pps / 244.2 Mbit/s captured at XPress-SW-A, 59.0 M packets,
# every drop counter 0, protocol-health ratios within the baseline's noise in 3 of 3 samples.
# Needs the mirror-path state in scripts/mirror-mtu-path.sh (dev45) and GRO off on the sensor
# (o2/tcpdump-sensor/README.md "Capture offloads and the transport MTU") for the zero-reorder
# capture; without them it is still drop-free but 5-6 % of TCP segments are captured out of order.
# **Contain first** (as gate90). Apply against the 0.9-gate deploy only.
