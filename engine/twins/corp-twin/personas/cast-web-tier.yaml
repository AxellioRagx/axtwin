# Rebalanced to §7's measured mix (corp-twin live run 3, 2026-09-28; docs/WORK_ORDER_corp_twin.md
# §11, pinned by tests/test_corp_twin_mix.py): SSH 1 KiB messages (§7 SSH 0.55 %).
persona:
  id: cast-web-tier
  os_family: linux
  drive: scripted
  emits:
  - proto: http
    ports:
    - 80
    peer_role: sink
    transport: tcp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: med
  - proto: ssh
    ports:
    - 22
    peer_role: sink
    transport: tcp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: med
    bytes: 1024
  requires: []
  knobs:
    intensity: 1.0
    schedule: 24x7
    seed_jitter: true
