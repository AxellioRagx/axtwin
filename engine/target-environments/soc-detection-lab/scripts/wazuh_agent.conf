<!-- axRange SOC: Wazuh agent config — ships host telemetry to the SIEM manager
     on the SOC segment (10.50.30.20). Dropped + enabled by the OP-OVL defense
     overlay (install-defense-agent); the agent binary comes from the host app. -->
<ossec_config>
  <client>
    <server>
      <address>10.50.30.20</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>axrange-soc</config-profile>
  </client>
  <syscheck>
    <disabled>no</disabled>
    <directories check_all="yes" realtime="yes">/etc,/var/www,/usr/bin</directories>
  </syscheck>
</ossec_config>
