# perimeter chokepoint — aggregates workstation web egress + DNS.
persona:
  id: egress-proxy
  os_family: linux
  drive: real-service
  emits:
    - proto: https
      ports: [443]
      peer_role: internet
      direction: NS
      cadence: diurnal
      volume: high
    - proto: dns
      ports: [53]
      peer_role: internet
      direction: NS
      cadence: diurnal
      volume: med
  requires: []
  # GAP-032: assert against Squid -- this perimeter chokepoint's actual
  # forward-proxy daemon.
  knobs: { intensity: 1.0, schedule: business-hours, seed_jitter: true, service_name: squid }
