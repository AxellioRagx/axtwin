# Loki — single-binary, filesystem storage. Minimal config for the axRange
# observability stack (Phase 1). Stores Suricata eve.json shipped by Alloy.
#
# This is the smallest thing that works (mirrors the capture appliance's
# "simplest thing that works" philosophy). Not tuned for scale; a single-node
# lab store. Bump limits / swap object storage when volume warrants it.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Allow modest out-of-order ingestion (eve.json lines can arrive slightly
  # reordered through Alloy batching) and a sane per-stream rate.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  allow_structured_metadata: true
  volume_enabled: true

# Retention handled by the compactor (lab default: keep ~15d to match Prom).
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true

analytics:
  reporting_enabled: false
