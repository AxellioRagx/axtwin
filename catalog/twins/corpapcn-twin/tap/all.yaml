# corpapcn-twin -- capture every segment to XPress-SW-A.
#
# One `segment` binding per segment, which resolves to EVERY port on that net including the
# router's own leg, rx-only (the derived direction for a multi-port scope), so each frame is
# captured exactly once. There is no wildcard selector and that is fine: the list is generated
# from the twin config, so it cannot drift from the twin it taps.
#
# Segment scope rather than the 5-port router SPAN of loop 1: this experiment compares the
# TWIN'S OWN traffic against the source network's, so intra-segment traffic must be visible.
# A router-port SPAN would omit it by construction and understate the twin.
#
# verify-capture is loud-skipped for XPress-SW-A by design (no QGA); capture is confirmed
# out-of-band over SSH.
tap-plan:
  target: corpapcn-twin
  bindings:
    - selector: { scope: segment, target: seg-10-1-10-0 }
      sensors: [XPress-SW-A]
    - selector: { scope: segment, target: seg-10-20-192-0 }
      sensors: [XPress-SW-A]
    - selector: { scope: segment, target: seg-10-20-193-0 }
      sensors: [XPress-SW-A]
