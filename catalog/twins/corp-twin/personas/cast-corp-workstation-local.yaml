    volume: low
  - proto: ldap
    ports:
    - 3268
    peer_role: domain-controller
    transport: tcp
    direction: EW
    optional: true
    cadence: cyclic:20s
    volume: med
  - proto: udp
    ports:
    - 67
    peer_role: broadcast
    transport: udp
    direction: EW
    optional: true
    cadence: cyclic:20s
    volume: low
  requires: []
  knobs:
    intensity: 1.0
    schedule: 24x7
    seed_jitter: true
