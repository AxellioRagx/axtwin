# trex-test -- the crowd's server side (drive: trex-astf). One TRex ASTF
# server on trex-server answers for 10.250.2.1-.14. ASTF's split mode needs
# both sides to load the same profile, so this persona takes the client's
# templates and ranges (`profile_from`) and only says which side it is.
persona:
  id: trex-crowd-server
  os_family: linux
  drive: trex-astf
  emits: []
  requires: []
  knobs:
    side: server
    profile_from: trex-crowd-client
