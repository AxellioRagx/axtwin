          # TREE_CONNECT response: disk share, full maximal access
          - { reply: "00000050fe534d4240000100000000000300010009000000000000000300000000000000fffe0000c69700007e53989b660615e131b4c2e982b045133ba7048be3d3758e100001000000000000000000ff011f00" }
          # CREATE request: Projects\design-notes.docx (overwrite-if for write)
