      - name: smb-write
        port: 445
        cps: 2
        servers: { range: 10.250.2.2/32 }
        program:
          # NEGOTIATE request: dialects 2.0.2-3.1.1, preauth/encryption/netname/signing contexts
          - { send: "" }
          # NEGOTIATE response: SMB 3.1.1, SPNEGO NegTokenInit (Kerberos, NTLMSSP)
          - { reply: "" }
          # SESSION_SETUP request #1: NTLMSSP_NEGOTIATE
          - { send: "" }
          # SESSION_SETUP response #1: MORE_PROCESSING_REQUIRED, NTLMSSP_CHALLENGE (CROWD/FS02)
          - { reply: "" }
          # SESSION_SETUP request #2: NTLMSSP_AUTH NTLMv2 CROWD\bob from WS-ENG-042
          - { send: "" }
          # SESSION_SETUP response #2: SUCCESS (signed); the session signs from here
          - { reply: "00000065fe534d4240000100000000000100200009000000000000000200000000000000fffe0000000000007e53989b660615e1783519681c27ddafea0f2c21742783190900000048001d00a11b3019a0030a0100a3120410010000003910e4a2fcff26e700000000" }
