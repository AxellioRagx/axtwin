# trex-test -- the crowd's client side (drive: trex-astf,
# engine/src/axrange/personas/drivers/trex_astf.py). One TRex ASTF client on
# trex-client emulates 50 INTERNAL hosts (10.250.1.1-.50) opening flows to two
# kinds of server, each answered by a different generator (the router's
# static routes decide which one sees a flow):
#
#   INTERNAL  fs01 10.250.2.1         SMB 3.1.1 file transfer   -> trex-server (lan-b)
#   EXTERNAL  198.51.100.1-.14 (web)  HTTP, TLS                 -> trex-ext (inet)
#             203.0.113.1-.2 (dns)    DNS                       -> trex-ext (inet)
#
# Template provenance:
#   http  avl/delay_10_http_browsing_0.pcap  one HTTP browsing exchange, TCP/80
#   dns   avl/delay_10_dns_0.pcap            one DNS query/response, UDP/53
#   tls   avl/delay_10_https_0.pcap          one HTTPS session (TLS records
#                                            replayed byte for byte), TCP/443
#   (all three are Cisco's sample captures bundled in TRex v3.08 under
#   /opt/trex/current/avl)
#   smb-* L7 programs GENERATED by scripts/gen-smb-sessions.py: whole SMB
#         3.1.1 sessions (negotiate, NTLMSSP login to the CROWD domain, tree
#         connect, create, 64 KiB reads or writes of a file, close, tree
#         disconnect, logoff), framed exactly as Windows frames them. The
#         script's docstring says what is real and what is not.
persona:
  id: trex-crowd-client
  os_family: linux
  drive: trex-astf
  emits:
    - { proto: tcp, ports: [445], peer_role: trex-server, optional: true, direction: EW }
    - { proto: tcp, ports: [80, 443], peer_role: trex-ext, optional: true, direction: NS }
    - { proto: dns, ports: [53], peer_role: trex-ext, optional: true, direction: NS }
  requires: []
  knobs:
    side: client
    crowd: { range: 10.250.1.0/24, count: 50 }
    # The profile-wide server range: the external web servers. The DNS and
    # SMB templates name their own.
    servers: { range: 198.51.100.0/24, count: 14 }
    peer_role: trex-ext
    mult: 1.0
    templates:
      - { name: http, pcap: avl/delay_10_http_browsing_0.pcap, cps: 20 }
      - { name: dns, pcap: avl/delay_10_dns_0.pcap, cps: 40, servers: { range: 203.0.113.0/29, count: 2 } }
      - { name: tls, pcap: avl/delay_10_https_0.pcap, cps: 10 }
      # BEGIN generated smb -- scripts/gen-smb-sessions.py writes this block; edit the script, not these lines.
      # Each template is one whole SMB 3.1.1 session against one file server (behind trex-server on lan-b).
      # smb-read: CROWD\alice on WS-FIN-017 downloads \\fs01.crowd.axr.lab\shared\Finance\Q3-forecast.xlsx (262144 bytes, 64 KiB chunks)
      - name: smb-read
        port: 445
        cps: 3
        servers: { range: 10.250.2.1/32 }
        program:
          # NEGOTIATE request: dialects 2.0.2-3.1.1, preauth/encryption/netname/signing contexts
          - { send: "" }
          # NEGOTIATE response: SMB 3.1.1, SPNEGO NegTokenInit (Kerberos, NTLMSSP)
          - { reply: "" }
          # SESSION_SETUP request #1: NTLMSSP_NEGOTIATE
          - { send: "" }
          # SESSION_SETUP response #1: MORE_PROCESSING_REQUIRED, NTLMSSP_CHALLENGE (CROWD/FS01)
          - { reply: "" }
          # SESSION_SETUP request #2: NTLMSSP_AUTH NTLMv2 CROWD\alice from WS-FIN-017
          - { send: "" }
          # SESSION_SETUP response #2: SUCCESS (signed); the session signs from here
          - { reply: "00000065fe534d4240000100000000000100200009000000000000000200000000000000fffe00000000000001fa8baa828dd15d12aeabfbcaed658baa441a2d9d6f02e60900000048001d00a11b3019a0030a0100a312041001000000b34812f29a59d93700000000" }
          # TREE_CONNECT request: \\fs01.crowd.axr.lab\shared
