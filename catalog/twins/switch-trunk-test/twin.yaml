# switch-trunk-test -- the root manifest: which file is each tier's default.
twin:
  id: switch-trunk-test
  description: "Two native switches (core, access-sw) on a trunk: office workstations and the file server behind access-sw, one router on core."
  containment: uncontained
  tiers:
    te:
      default: te.yaml
    tfc:
      default: tfc/default.yaml
    tap:
      default: tap/default.yaml
