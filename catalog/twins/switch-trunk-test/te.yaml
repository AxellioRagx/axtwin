# switch-trunk-test -- two native switches joined by a trunk
# (docs/design/native-switches.md §11; the switch<->switch patch-link and
# trunk-port fixture beside switch-test).
#
#   gw --eth0/Te1 (office)--- core ---Po1 trunk [office, servers]--- access-sw
#      --eth1/Te2 (servers)--/                                        |  P1 ws01 (office)
#                                                                     |  P2 ws02 (office)
#                                                                     |  P3 file-server (servers)
#
# Both segments are carried by native switches, so the twin has no SDN zone
# at all: office and servers are VLANs 10 and 20 on the two bridges, and the
# core<->access trunk is one OVS patch pair carrying both. gw reaches every
# host across that patch, so a working ping proves the trunk forwards both
# VLANs. Phase 2 puts a SPAN session on access-sw's Po1 (a trunk port).
twin_config:
  id: switch-trunk-test
  description: "Two native switches (core, access-sw) on a trunk: office workstations and the file server behind access-sw, one router on core."

  segments:
    - { name: office, cidr: 10.72.10.0/24, zone_type: vlan }
    - { name: servers, cidr: 10.72.20.0/24, zone_type: vlan }

  nodes:
    - name: corp-workstation
      role: corp-workstation
      image: debian-12-cloud@v1
      count: 2
      net: office
    - name: file-server
      role: file-server
      image: ubuntu-server-22@v5
      nets:
        - { segment: servers, ip: 10.72.20.10 }
    - name: core
      kind: switch
      role: l2-switch
      source: authored
    - name: access-sw
      kind: switch
      role: l2-switch
      source: authored
    - name: gw
      kind: router
      image: debian-12-cloud@v1
      nets:
        - { segment: office }
        - { segment: servers }

  links:
    - a: { device: gw, port: eth0 }
      b: { device: core, port: Te1 }
      mode: access
      vlans: [office]
      source: authored
    - a: { device: gw, port: eth1 }
      b: { device: core, port: Te2 }
      mode: access
      vlans: [servers]
      source: authored
    - a: { device: core, port: Po1 }
      b: { device: access-sw, port: Po1 }
      mode: trunk
      vlans: [office, servers]
      source: authored
    - a: { device: access-sw, port: P1 }
      b: { device: corp-workstation01, port: eth0 }
      mode: access
      vlans: [office]
      source: authored
    - a: { device: access-sw, port: P2 }
      b: { device: corp-workstation02, port: eth0 }
      mode: access
      vlans: [office]
      source: authored
    - a: { device: access-sw, port: P3 }
      b: { device: file-server, port: eth0 }
      mode: access
      vlans: [servers]
      source: authored
