persona:
  id: cast-dns-resolver
  os_family: linux
  drive: scripted
  emits:
  - proto: dns
    ports:
    - 53
    peer_role: internet-sink-4
    transport: udp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  - proto: http
    ports:
    - 80
    peer_role: internet-sink-2
    transport: tcp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  - proto: ntp
    ports:
    - 123
    peer_role: internet-sink-1
    transport: udp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  requires: []
  knobs:
    intensity: 1.0
    schedule: 24x7
    seed_jitter: true
