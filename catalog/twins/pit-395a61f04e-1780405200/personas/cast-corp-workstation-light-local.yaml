# os_family: windows, not the cast's linux (corp-twin live run 3, 2026-09-28): every
# corp-workstation host in this twin is a Windows image (win11-finance@v4), and a linux
# persona there launches sh/python3 over QGA -> "Failed to execute child process" on every
# attempt. `tfc validate` now refuses the mismatch (docs/WORK_ORDER_corp_twin.md §11).
persona:
  id: cast-corp-workstation-light-local
  os_family: windows
  drive: scripted
  emits:
  - proto: kerberos
    ports:
    - 88
    peer_role: domain-controller
    transport: tcp
    direction: EW
    optional: true
    cadence: cyclic:5s
    volume: low
  - proto: kerberos
    ports:
    - 88
    peer_role: domain-controller
    transport: udp
    direction: EW
    optional: true
    cadence: cyclic:5s
    volume: low
  - proto: http
    ports:
    - 80
    peer_role: internet-sink-4
    transport: tcp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  - proto: ntp
    ports:
    - 123
    peer_role: domain-controller
    transport: udp
    direction: EW
    optional: true
    cadence: cyclic:5s
    volume: low
  - proto: ldap
    ports:
    - 389
    peer_role: domain-controller
    transport: tcp
    direction: EW
    optional: true
    cadence: cyclic:5s
    volume: low
  - proto: https
    ports:
    - 443
    peer_role: internet-sink-2
    transport: tcp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  - proto: ldap
    ports:
    - 389
    peer_role: internet-sink-1
    transport: udp
    direction: EW
    optional: true
    peer_scope: all
    cadence: cyclic:5s
    volume: low
  requires: []
  knobs:
    intensity: 1.0
    schedule: 24x7
    seed_jitter: true
