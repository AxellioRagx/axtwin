# switch-test -- canvas-test's shape with ONE native access switch between the
# router and the office workstations (docs/design/native-switches.md; was the
# device tree's imageless "deploys as nothing" fixture, topology-layers.md
# track 2, 2026-11-07).
#
# `access-sw` has no image, so on Proxmox (which declares `native-switch`) it
# deploys as an adapter-owned OVS bridge: `office` leaves SDN and becomes VLAN
# 10 on that bridge; `servers` (no switch carries it) stays an SDN vnet. The
# trunk from `gw` (native office) and one access link per workstation are its
# ports. The workstations are a `count: 2` group, wired by instance id
# (`corp-workstation01` / `02`, native-switches §12 S1, 2026-11-12), so each
# gets its own port: P1 and P2.
#
# The canvas draws gw -> access-sw -> the workstations and gw -> an implied
# switch for `servers` -> file-server (topology-layers §7.1).
twin_config:
  id: switch-test
  description: "canvas-test with a native access switch: office workstations on access-sw ports P1/P2, a file server, one router, tapped to XPress-SW-A."

  segments:
    - { name: office, cidr: 10.71.10.0/24, zone_type: vlan }
    - { name: servers, cidr: 10.71.20.0/24, zone_type: vlan }

  nodes:
    - name: corp-workstation
      role: corp-workstation
      image: debian-12-cloud@v1
      count: 2
      net: office
      members:
        - { index: 2, role: jump-host, source: authored }
    - name: file-server
      role: file-server
      image: ubuntu-server-22@v5
      nets:
        - { segment: servers, ip: 10.71.20.10 }
    - name: access-sw
      kind: switch
      role: l2-switch
      source: authored
    - name: gw
      kind: router
      image: debian-12-cloud@v1
      nets:
        - { segment: office }
        - { segment: servers }

  links:
    - a: { device: gw, port: eth1 }
      b: { device: access-sw, port: SFP1 }
      mode: trunk
      native: office
      vlans: [office]
      source: authored
    - a: { device: access-sw, port: P1 }
      b: { device: corp-workstation01, port: eth0 }
      mode: access
      vlans: [office]
      source: authored
    - a: { device: access-sw, port: P2 }
      b: { device: corp-workstation02, port: eth0 }
      mode: access
      vlans: [office]
      source: authored
