# Tap plan: switch-test / default -- a SPAN session on the native access switch
# (docs/design/native-switches.md §6): access-sw's uplink SFP1, both
# directions, to the external packetXpress sink XPress-SW-A (declared in the
# dev45 target's lab; its capture is confirmed on the appliance, not here).
# The OVS mirror on access-sw's bridge outputs into the keyed gretap toward
# the sink; frames keep their 802.1Q tag (office = VLAN 10).
#
# Before 2026-11-12 this was a `segment` tap on office (and before that the
# office<->servers boundary); a `segment` binding still works, compiled to an
# rx mirror of every office port on access-sw (D8).
tap-plan:
  target: switch-test
  bindings:
    - span:
        switch: access-sw
        sources:
          - { port: SFP1, dir: both }
      sensors: [XPress-SW-A]
      mode: exclusive
