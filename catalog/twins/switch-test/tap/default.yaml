# Tap plan: switch-test / default -- the office segment to the external
# packetXpress sink XPress-SW-A (declared in the dev45 target's lab; its capture
# is confirmed on the appliance, not here).
#
# 2026-11-11: was `boundary [office, servers]` (one chip on gw). The canvas now
# draws the segment as the switch that carries it, so this chip rides access-sw.
# Not a `port` tap on access-sw's uplink (SFP1): access-sw is imageless, deploys
# no VM, and the engine derives tap points only from VM interfaces, so a port
# selector on it would resolve to nothing. A segment tap resolves to every port
# on office (gw's leg and the workstations), mirrored rx-only.
tap-plan:
  target: switch-test
  bindings:
    - selector: { scope: segment, target: office }
      sensors: [XPress-SW-A]
      mode: exclusive
