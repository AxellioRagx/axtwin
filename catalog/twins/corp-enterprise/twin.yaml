# corp-enterprise -- the root manifest (docs/WORK_ORDER_twin_consolidation.md §2;
# loader: axrange/twinconfig/manifest.py). Wiring only: which file is each
# tier's default and which are its variants. Every tier file stays
# deployable on its own by path; the manifest adds
# `--config corp-enterprise` and `--twin corp-enterprise [--variant <stem>]`.
#
# `containment:` is a CLAIM the loader checks against te.yaml's
# `twin_config.egress:` block (D3) -- not a second copy of the posture.
# tfc/roles.yaml is a `roles_from:` fragment, not a deployable profile, so it
# is not listed. The 2026-08-13 max-capture-rate ramp is a dated record under
# docs/archive/twin-runs/2026-08-13-corp-enterprise-maxrate/.
twin:
  id: corp-enterprise
  description: >
    AD workhorse enterprise twin: corp-lan/server-vlan/dmz/mgmt behind a
    router with WAN egress, a full AD domain, crown-jewel PII on the file
    server.
  containment: uncontained
  tiers:
    te:
      default: te.yaml
    tap:
      default: tap/default.yaml
      variants: [tap/reshard.yaml, tap/xpress.yaml, tap/xpress-peri.yaml, tap/gw-span.yaml]
    tfc:
      default: tfc/default.yaml
      variants: [tfc/busy.yaml, tfc/xseg.yaml]
    exr:
      variants: [exr/ad-killchain.yaml]
