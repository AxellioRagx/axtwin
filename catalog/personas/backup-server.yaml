# big periodic bursts, scripted client (rsync/smb/borg on a schedule window).
persona:
  id: backup-server
  os_family: linux
  drive: scripted
  emits:
    - proto: rsync
      ports: [873]
      peer_role: file-server
      direction: EW
      cadence: "burst:2h"
      volume: high
    - proto: smb
      ports: [445]
      peer_role: corp-workstation
      direction: EW
      cadence: "burst:2h"
      volume: med
    - proto: borg
      ports: [22]
      peer_role: file-server
      direction: EW
      cadence: "cyclic:24h"
      volume: high
  requires: [file-server, corp-workstation]
  knobs: { intensity: 1.0, schedule: "overnight", seed_jitter: true }
