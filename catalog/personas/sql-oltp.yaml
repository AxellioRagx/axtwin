# App mix (engine/src/axrange/trafficgen/SPEC.md): short OLTP sessions against
# a database tier in MySQL wire format (login, SELECT, UPDATE, quit).
persona:
  id: sql-oltp
  category: traffic
  label: "SQL OLTP sessions (emulated)"
  blurb: "Emulated app servers log in, read and update orders."
  os_family: linux
  drive: trex-astf
  emits:
    - { proto: mysql, ports: [3306], peer_role: db-tier, transport: tcp }
  requires: [db-tier]
  mix:
    - { app: sql-query, weight: 1 }
