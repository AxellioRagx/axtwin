# Cross-segment persona: server-vlan -> dmz. See xseg-corp-to-srv.yaml for
# the family rationale.
#
# The return direction of xseg-dmz-to-srv, so gw's server-vlan and dmz legs
# both carry traffic in both directions rather than a single one-way flow --
# which is what makes the `perimeter` scope's derived `both` direction worth
# having on those two ports.
persona:
  id: xseg-srv-to-dmz
  os_family: linux
  drive: scripted
  emits:
    - proto: netflow
      ports: [2055]
      peer_role: dmz-web
      transport: udp
      direction: EW
      cadence: "cyclic:2s"
      volume: high
    - proto: http
      ports: [80]
      peer_role: dmz-web
      transport: tcp
      direction: EW
      cadence: "cyclic:5s"
      volume: med
    - proto: http
      ports: [3128]
      peer_role: egress-proxy
      transport: tcp
      direction: EW
      cadence: "cyclic:15s"
      volume: med
    - proto: smtp
      ports: [25]
      peer_role: mail-server
      transport: tcp
      direction: EW
      cadence: "cyclic:30s"
      volume: low
  requires: [dmz-web, egress-proxy, mail-server]
  knobs: { intensity: 1.0, schedule: "24x7", seed_jitter: false }
