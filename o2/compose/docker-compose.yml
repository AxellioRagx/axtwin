# axRange observability stack — Grafana OSS + Loki + Prometheus.
#
# Phase 1 of the axRange UI (docs/DESIGN_BRIEF_ui.md §8): the telemetry/observe
# half. AUTHOR + VALIDATE ONLY — live bring-up is human-gated (see README.md).
#
# All tunables come from ../observability.conf (copy from observability.conf.example).
# Bring it up with:
#   docker compose --env-file ../observability.conf -f docker-compose.yml up -d
# Validate config (no bring-up):
#   docker compose --env-file ../observability.conf -f docker-compose.yml config -q
#
# Image versions are pinned via ${..._IMAGE} from observability.conf — never :latest.
# Defaults after :- are only a fallback so `config` works before the conf is copied.

name: axrange-observability

services:
  # --------------------------------------------------------------------------
  # Prometheus — scrapes the capture appliance's node_exporter (capture health textfile).
  # --------------------------------------------------------------------------
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    container_name: axr-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------------------------
  # Loki — log store for Suricata eve.json (pushed by Alloy on the network sensor).
  # --------------------------------------------------------------------------
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    container_name: axr-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Grafana OSS — the operator surface. Datasources + dashboards are PROVISIONED
  # (read-only mounts), so the stack is reproducible from git, no click-ops.
  # --------------------------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.4.0}
    container_name: axr-grafana
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    # Lets the in-container Infinity datasource reach an API on the docker HOST
    # via http://host.docker.internal:8080 (Linux needs this explicit mapping;
    # Docker Desktop provides it automatically). Harmless if AXRANGE_API_URL is a
    # real LAN IP instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Datasource plugin (not bundled): Infinity — the D2 fold-in was retired with the
      # deploy/op-status dashboard (2026-10-01), but the API stays a telemetry source for
      # whatever future panel wants it, so the plugin stays installed.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-axrange-change-me}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Provisioning paths (mounted below).
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Phase 1 is read-only telemetry; no anonymous write. Leave auth default.
      GF_USERS_DEFAULT_THEME: dark
      # Exposed so the provisioned Infinity (axRange API) datasource can resolve
      # the API base URL + optional bearer token (D2 fold-in). AXRANGE_API_URL
      # must be reachable FROM this container (the host's LAN IP / docker gateway,
      # NOT 127.0.0.1). Blank token = no Authorization header (open reads).
      AXRANGE_API_URL: ${AXRANGE_API_URL:-http://host.docker.internal:8080}
      AXRANGE_API_TOKEN: ${AXRANGE_API_TOKEN:-}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --------------------------------------------------------------------------
  # Caldera server — A3 Stage B (docs/DESIGN_BRIEF_o2_attack_defense.md §3): the
  # standing O2 red-team server the substrate's Sandcat agents (overlays.adversary,
  # render_sandcat_agent) beacon to over plain HTTP on :8888. No published Docker
  # Hub image upstream — built locally from a pinned git tag (../caldera/Dockerfile).
  # Manual playout only (no engine/o2control automation of abilities — see README).
  # --------------------------------------------------------------------------
  caldera:
    build:
      context: ../caldera
      args:
        CALDERA_VERSION: ${CALDERA_VERSION:-5.0.0}
    image: axrange/caldera:${CALDERA_VERSION:-5.0.0}
    container_name: axr-caldera
    restart: unless-stopped
    ports:
      - "${CALDERA_UI_PORT:-8888}:8888"      # web UI + Sandcat HTTP contact channel
      - "${CALDERA_TCP_PORT:-7010}:7010"     # optional TCP contact channel
      - "${CALDERA_UDP_PORT:-7011}:7011/udp" # optional UDP contact channel
    volumes:
      - caldera-data:/usr/src/app/data
      # conf/local.yml carries encryption_key/crypt_salt + API keys, generated on
      # first boot. Without persisting it too, a down+up regenerates the key and
      # the persisted data/object_store (run history) becomes undecryptable.
      - caldera-conf:/usr/src/app/conf
    healthcheck:
      # No wget/curl in the build image (only git/build-essential are apt-installed,
      # see ../caldera/Dockerfile) -- python3 IS guaranteed present (it's the base
      # image), so probe with it rather than adding a package for this alone.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8888/', timeout=3) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Wazuh manager — A3 Stage B: the standing O2 blue-team server the substrate's
  # Wazuh agents (overlays.defense, install-defense-agent's wazuh-agent branch)
  # enroll to (:1515/tcp) and ship events to (:1514/tcp -- Wazuh 4.x manager +
  # agent default to TCP, not UDP, for the event channel). Manager-only (no
  # indexer/dashboard — see README "Attack/defense servers" for why that's
  # deferred, not built here); alerts/events are read via the Wazuh manager API
  # (:55000) or its local alerts.json, same pattern Suricata's eve.json feeds
  # Loki via Alloy.
  # --------------------------------------------------------------------------
  wazuh-manager:
    image: ${WAZUH_MANAGER_IMAGE:-wazuh/wazuh-manager:4.9.2}
    container_name: axr-wazuh-manager
    restart: unless-stopped
    hostname: wazuh-manager
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514/tcp"  # agent event channel (TCP, 4.x default)
      - "${WAZUH_ENROLL_PORT:-1515}:1515"     # agent enrollment (agent_auth)
      - "${WAZUH_API_PORT:-55000}:55000"      # Wazuh manager REST API
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-var-multigroups:/var/ossec/var/multigroups
      - wazuh-manager-integrations:/var/ossec/integrations
      - wazuh-manager-active-response:/var/ossec/active-response/bin
      # GAP-017: the image's s6-managed filebeat co-process auto-starts expecting a
      # wazuh-indexer sibling that this manager-only stack doesn't have; with no
      # filebeat.yml at all it hard-exits code=1 and takes the whole container down.
      # This stub (../wazuh/filebeat-stub.yml) gives it an empty-inputs/file-output
      # config so it idles harmlessly instead -- see docs/WORK_ORDER_o2_server_stack.md §3.2.
      - ../wazuh/filebeat-stub.yml:/etc/filebeat/filebeat.yml:ro
      # LOAD-BEARING half of the GAP-017 fix, proven live 2026-07-15 on dev45 VM 102: the
      # stub above is NOT sufficient by itself -- filebeat refuses to start on a config file
      # it doesn't own ("must be owned by the user identifier (uid=0) or root"), and a
      # git-tracked bind mount carries the HOST's uid (1000 here), which git cannot control.
      # That rejection crash-loops the container exactly like the missing-file case the stub
      # was meant to fix. This empty s6 `down` file (../wazuh/filebeat-down) disables the
      # image's filebeat service at the s6 supervisor level -- filebeat never launches, so it
      # never hits the ownership check and can't exit -- which is ownership-independent and
      # is what actually keeps the manager up. Docs: docs/WORK_ORDER_o2_server_stack.md §3.2
      # ("... or disable the filebeat s6 service") + docs/PRODUCT_GAPS.md GAP-017. The stub
      # mount above is kept as secondary/intent-documentation (harmless, matches the state
      # proven live on the VM, which has both mounts) but does not by itself prevent the crash.
      - ../wazuh/filebeat-down:/etc/services.d/filebeat/down:ro
    healthcheck:
      # wazuh-remoted is the daemon agents actually connect to (1514/1515); a
      # wazuh-modulesd-only check can report healthy while remoted is down and
      # agents can't enroll or ship events.
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# Note: Grafana Alloy is NOT a service here — it runs ON THE NETWORK SENSOR VM
# (next to Suricata's eve.json), not on the stack host. See alloy/config.alloy
# and systemd/alloy-axrange.service. (If you co-locate the network sensor with this
# stack, you can add an alloy service mounting /var/log/suricata; documented in
# README "Host options".)

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  caldera-data:
  caldera-conf:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-var-multigroups:
  wazuh-manager-integrations:
  wazuh-manager-active-response:
